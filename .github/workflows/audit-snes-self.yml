name: Audit PS3 pSNES NPDRM to plain SELF path
on:
  push:
    branches: [fix/v15-41-snes-plain-self-spawn]
    paths: [.github/workflows/audit-snes-self.yml]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-22.04
    env:
      TOOLCHAIN_URL: https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Restore PSL1GHT toolchain
        uses: actions/cache@v4
        id: tc
        with:
          path: ps3dev
          key: ps3dev-https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz-v1
      - name: Fetch toolchain if cache is empty
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          curl -fLsS --retry 3 "$TOOLCHAIN_URL" | tar xz -C ./
      - name: Inspect tools and SELF headers
        run: |
          set -euo pipefail
          export PATH="$PWD/ps3dev/bin:$PWD/ps3dev/ppu/bin:$PATH"
          echo "== tool inventory =="
          find ps3dev -maxdepth 5 -type f \( -iname '*self*' -o -iname '*sce*tool*' -o -iname '*unself*' -o -name 'fself*' -o -name 'keys' \) | head -65 || true
          for t in scetool fake_scetool make_self make_self_npdrm fself unself readself ppu-readelf openssl; do
            type "$t" || true
          done
          echo "== upstream release EBOOT =="
          curl -fLsS --retry 3 https://github.com/theheroGAC/pemu-ps3/releases/download/7.2/psnes.pkg -o /tmp/upstream_psnes.pkg
          printf '%s  %s\n' 9c7a5f3eae36b08ef6fa0715b61daee343160eac33c3d03fa30ccbe41fc8f7fc /tmp/upstream_psnes.pkg | sha256sum -c -
          python3 tools/bundle_psnes.py --pkg /tmp/upstream_psnes.pkg --out /tmp/psnes-stage --header /tmp/sf_psnes_filelist.h
          file /tmp/psnes-stage/USRDIR/EBOOT.BIN
          od -Ax -tx1 -N 120 /tmp/psnes-stage/USRDIR/EBOOT.BIN
          echo "== scetool capabilities =="
          if command -v scetool >/dev/null 2>&1; then scetool --help | head -75 || true; fi
          if command -v fake_scetool >/dev/null 2>&1; then fake_scetool --help | head -40 || true; fi
      - name: Convert verified FREE NPDRM homebrew to plain PS3 APP SELF
        run: |
          set -euo pipefail
          export PATH="$PWD/ps3dev/bin:$PWD/ps3dev/ppu/bin:$PATH"
          echo "== build open-source scetool =="
          git clone -q --depth 1 https://github.com/naehrwert/scetool /tmp/sf_scetool
          make -C /tmp/sf_scetool -j 2 CC=g++ LDFLAGS=-lz 2>&1 | tail -45
          test -x /tmp/sf_scetool/scetool
          mkdir -p /tmp/sf_scetool/data /tmp/snes_plain
          for f in keys ldr_curves vsh_curves; do
            curl -fLsS --retry 3 \
              "https://raw.githubusercontent.com/aldostools/IRISMAN/master/rawseciso/data/$f" \
              -o "/tmp/sf_scetool/data/$f"
            test -s "/tmp/sf_scetool/data/$f"
          done
          cd /tmp/sf_scetool
          echo "== original EBOOT metadata type =="
          ./scetool -i /tmp/psnes-stage/USRDIR/EBOOT.BIN | head -75
          echo "== decrypt original FREE homebrew NPDRM for PS3 execution =="
          ./scetool -d /tmp/psnes-stage/USRDIR/EBOOT.BIN /tmp/snes_plain/psnes_original.elf
          ppu-readelf -h /tmp/snes_plain/psnes_original.elf | head -28
          test "$(od -An -tx1 -N4 /tmp/snes_plain/psnes_original.elf | tr -d ' \n')" = "7f454c46"
          echo "== sign PS3 standalone APP SELF =="
          make_self /tmp/snes_plain/psnes_original.elf /tmp/snes_plain/PSNES_ENGINE.SELF
          test -s /tmp/snes_plain/PSNES_ENGINE.SELF
          ./scetool -i /tmp/snes_plain/PSNES_ENGINE.SELF | head -75
          sha256sum /tmp/snes_plain/psnes_original.elf /tmp/snes_plain/PSNES_ENGINE.SELF
          echo "== inspect app self decrypt roundtrip =="
          ./scetool -v -d /tmp/snes_plain/PSNES_ENGINE.SELF /tmp/snes_plain/APP_roundtrip.elf || true
          ls -lha /tmp/snes_plain/APP_roundtrip.elf || true
          if test -f /tmp/snes_plain/APP_roundtrip.elf; then
             sha256sum /tmp/snes_plain/APP_roundtrip.elf
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: psnes-v72-standalone-self-audit
          path: /tmp/snes_plain/PSNES_ENGINE.SELF
          retention-days: 7
