name: Probe BDISO tab asset (temporary)
on:
  push:
    branches: [fix/v15-30-bdiso-disco-115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-png:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect untouched previous version of BDISO logo
        run: |
          python3 - <<'PY'
          import base64,struct
          from pathlib import Path
          data=Path("pkgfiles/USRDIR/TABS/bdiso.png").read_bytes()
          print("BDISO_SIZE",len(data))
          print("BDISO_DIMENSIONS",struct.unpack(">II",data[16:24]))
          print("BDISO_PNG_BASE64_BEGIN")
          print(base64.b64encode(data).decode())
          print("BDISO_PNG_BASE64_END")
          PY
