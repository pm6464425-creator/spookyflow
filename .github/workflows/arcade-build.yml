name: SpookyFlow V15.74 expanded CRC-verified arcade clones
on:
  workflow_dispatch:
  push:
    branches:
      - fix/v15-74-arcade-crc-detection-33-clones
jobs:
  arcade-pkg:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Check Arcade settings compatibility (reproduces original black-screen crash)
        run: |
          gcc -std=c99 -O1 -g -Wall -Wextra -Werror=implicit-function-declaration \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc/core \
            src/core/settings.c src/core/util.c tests/test_arcade_settings_sixth.c \
            -o /tmp/test_arcade_settings_sixth
          /tmp/test_arcade_settings_sixth
      - name: Verify /dev_hdd0/ARCADE ZIP/7z scanning and legacy fallback names
        run: |
          gcc -std=c99 -O1 -g -Wall -Wextra -Werror=implicit-function-declaration -Isrc/core \
            src/core/*.c tests/test_arcade_identification.c tests/null_render.c \
            -lm -lpthread -o /tmp/test_arcade_identification
          /tmp/test_arcade_identification
      - name: Verify Arcade 7500 ZIP scans, 10000-game boundary and original console limit
        run: |
          gcc -std=c99 -O1 -g -Wall -Wextra -Werror=implicit-function-declaration \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc/core \
            src/core/*.c tests/test_arcade_10000_pages.c tests/null_render.c \
            -lm -lpthread -o /tmp/test_arcade_10000_pages
          /tmp/test_arcade_10000_pages
      - name: Verify Arcade shortname URLs, compact JPG saving, manual covers and unknown ROM safety
        run: |
          gcc -std=c99 -O1 -g -Wall -Wextra -Werror=implicit-function-declaration \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc/core \
            src/core/*.c tests/test_arcade_cover_source.c tests/null_render.c \
            -lm -lpthread -o /tmp/test_arcade_cover_source
          /tmp/test_arcade_cover_source
      - name: Verify Arcade direct auto-engine routing by code and isolation
        run: |
          gcc -std=c99 -O1 -g -Wall -Wextra -Werror=implicit-function-declaration \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DARCADE_ENGINE_MAP_PATH='"tests/fixtures/arcade_engines.tsv"' \
            -Isrc/core src/core/arcade_engine.c tests/test_arcade_engine_router.c \
            -o /tmp/test_arcade_engine_router
          /tmp/test_arcade_engine_router
      - name: Verify Arcade single TXT and exact ZIP CRC audit (no ROM writes)
        run: |
          python3 - <<'PY'
          import zipfile,zlib
          from pathlib import Path
          path=Path('/tmp/gng.zip')
          files={'good.bin':b'GOOD1234','wrong.bin':b'NOT_MATCHING'}
          with zipfile.ZipFile(path,'w',zipfile.ZIP_STORED) as z:
              for n,data in files.items():z.writestr(n,data)
          crc=zlib.crc32(files['good.bin'])
          manifest=Path('/tmp/arcade_test_manifest.tsv')
          manifest.write_text('# generated test\n'
              'gng\t\t\t@\t-\t-\n'
              f'gng\t\t\tgood.bin\t{crc:08x}\t{len(files["good.bin"])}\n'
              'gng\t\t\twrong.bin\t11111111\t12\n'
              'gng\t\t\tmissing.bin\t22222222\t10\n')
          import hashlib
          Path('/tmp/gng.sha256').write_text(hashlib.sha256(path.read_bytes()).hexdigest())
          print("TEST ZIP",path.stat().st_size,"bytes, wrong CRC + missing file")
          PY
          gcc -std=gnu99 -O1 -g -Wall -Wextra -Werror=implicit-function-declaration \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            '-DSF_ARCADE_DIAG_PATH="/tmp/diagnostico_mame.txt"' \
            '-DSF_ARCADE_ROM_MANIFEST="/tmp/arcade_test_manifest.tsv"' \
            -Isrc/core src/core/arcade_diag.c tests/test_arcade_single_diag.c \
            -o /tmp/test_arcade_single_diag
          /tmp/test_arcade_single_diag /tmp/gng.zip /tmp/gng.zip
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          data=Path('/tmp/diagnostico_mame.txt').read_text()
          assert 'MANIFEST_CRC_INCORRECTOS=1' in data
          assert 'MANIFEST_ROMS_FALTANTES=1' in data
          assert 'FASE=INTENTANDO_INICIAR_MOTOR_PS3' not in data
          assert hashlib.sha256(Path('/tmp/gng.zip').read_bytes()).hexdigest()==Path('/tmp/gng.sha256').read_text()
          print("PASS: one overwritten MAME TXT, CRC mismatches and missing ROM diagnosed; ZIP unchanged")
          PY
      - name: Set up PS3 SDK
        run: |
          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 --silent --show-error             https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz | tar xz -C ./
          echo "$GITHUB_WORKSPACE/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/ppu/bin" >> "$GITHUB_PATH"
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nvidia-cg-toolkit python2 || true
          command -v cgc
      - name: Build exact V15.53 project + independent Arcade tab
        run: bash ci/build_ps3.sh
      - name: Verify compiled Arcade flyer source index contains real published image names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path("pkgfiles/USRDIR/ARCADE/arcade_boxart_index.tsv")
          data=f.read_text(encoding="utf-8")
          entries=[ln.split("\t") for ln in data.splitlines() if ln and not ln.startswith("#")]
          assert len(entries)>=2000, len(entries)
          assert all(len(row)==3 and row[0] for row in entries)
          indexed=dict((row[0],row[1:]) for row in entries)
          for name in ("gng","ghouls","mslug3","sf2","wh1"):
              if name in indexed:
                  assert any(v.endswith(".png") for v in indexed[name]),(name,indexed[name])
          print("PASS: verified Libretro arcade mappings",len(entries),"index bytes",f.stat().st_size)
          PY
      - name: Validate official FBNeo ROM-name catalogue and real ROM scanning
        run: |
          test -s pkgfiles/USRDIR/ARCADE/arcade_titles.tsv
          gcc -std=c99 -O1 -g -Wall -Wextra -Werror=implicit-function-declaration -Isrc/core \
            '-DARCADE_DB="pkgfiles/USRDIR/ARCADE/arcade_titles.tsv"' \
            src/core/*.c tests/test_arcade_identification.c tests/null_render.c \
            -lm -lpthread -o /tmp/test_arcade_identification_full
          /tmp/test_arcade_identification_full full
      - name: Verify PC bridge is disabled by default and never replaces native ROMs
        run: |
          test -s src/ps3/ps3_arcade_bridge.c
          test -s pkgfiles/USRDIR/ARCADE/PC_BRIDGE_INSTRUCCIONES.txt
          grep -q 'sf_pc_arcade_try_launch' src/ps3/main.c
          grep -q 'if(!engine || sf_pc_arcade_preferred())' src/ps3/main.c
          grep -q 'PC_BRIDGE_DESACTIVADO' src/ps3/ps3_arcade_bridge.c
          grep -q 'PC_BRIDGE_JUEGO_INICIADO_ABRIR_MOONLIGHT_PS3' src/ps3/ps3_arcade_bridge.c
          grep -q '/dev_hdd0/tmp/spookyflow/pc_bridge.cfg' src/ps3/ps3_arcade_bridge.c
          echo "PASS: no PC network unless explicitly enabled; PS3 games untouched"
      - name: Verify native arcade core signatures and 16:9 configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for n in ("pkgfiles/USRDIR/cores/fb_neo.SELF",
                    "pkgfiles/USRDIR/MAME125/mame125.SELF",
                    "pkgfiles/USRDIR/RELOAD.SELF"):
              v=Path(n).read_bytes()
              assert v[:4]==b'SCE\x00',n
              p=struct.unpack_from('>Q',v,0x28)[0]
              assert struct.unpack_from('>I',v,p+12)[0]==4,n
          c=Path("pkgfiles/USRDIR/retroarch.cfg").read_text()
          assert 'video_fullscreen = "true"' in c
          assert 'video_aspect_ratio = "1.777800"' in c
          assert 'aspect_ratio_index = "1"' in c
          assert 'video_force_aspect = "false"' in c
          assert 'auto_overrides_enable = "false"' in c
          assert 'config_save_on_exit = "false"' in c
          assert 'custom_viewport_width = "1280"' in c
          assert 'custom_viewport_height = "720"' in c
          assert 'custom_viewport_x = "0"' in c
          assert 'custom_viewport_y = "0"' in c
          assert 'FBNE00123' not in c
          m=Path("pkgfiles/USRDIR/ARCADE/arcade_engines.tsv").read_text()
          assert sum(len(l.split("\t"))==2 for l in m.splitlines() if not l.startswith("#"))>=6500
          print("PASS: native APP SELF type4, two motors, 16:9 config, DB")
          PY
      - name: Verify only Arcade creates a TXT; archived reports not regenerated
        run: |
          test -s pkgfiles/USRDIR/ARCADE/fbneo_ps3_crc_manifest.tsv
          test -s pkgfiles/USRDIR/ARCADE/mame0125_neogeo.tsv
          grep -q 'SF_ARCADE_DIAG_ONLY=1' Makefile
          grep -q 'ps3_fs_cleanup_legacy_diagnostics' src/ps3/main.c
          grep -q 'diagnostico_mame.txt' src/core/arcade_diag.h
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('pkgfiles/USRDIR/ARCADE/fbneo_ps3_crc_manifest.tsv').read_text().splitlines()
          assert len(lines)>=30000
          gng=[v for v in lines if v.startswith('gng\t')]
          assert any('\t@\t' in v for v in gng)
          assert any('\t' in v for v in gng)
          print("PASS frozen PS3 FBNeo checksum map",len(lines),"entries, gng",len(gng))
          PY
      - name: Verify legacy FBNeo descriptor-only transformations
        run: |
          python3 tests/test_fbneo_legacy_binary_patch.py
          grep -q 'ARCADE_ENGINE_FBNEO_LEGACY=3' src/core/arcade_engine.h
          grep -q 'fb_neo_legacy.SELF' src/ps3/main.c
          grep -q 'args\[9\]=engine==ARCADE_ENGINE_FBNEO_LEGACY ? fbneo_legacy : fbneo;' src/ps3/main.c
          grep -q 'NEOGEO_OLD_BIOS_ALL_CHIPS_MATCH_SELECT_FBNEO_LEGACY' src/core/arcade_native_select.c
          test -s pkgfiles/USRDIR/ARCADE/fbneo_legacy_aliases.tsv
          test -s pkgfiles/USRDIR/ARCADE/fbneo_legacy_games.tsv
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pkgfiles/USRDIR/ARCADE/fbneo_legacy_games.tsv')
          games={ln.split("\t")[0] for ln in p.read_text().splitlines() if ln and not ln.startswith("#")}
          aliases=[ln for ln in Path('pkgfiles/USRDIR/ARCADE/fbneo_legacy_aliases.tsv').read_text().splitlines() if ln and not ln.startswith("#")]
          assert len(games)>=70, len(games)
          assert len(aliases)>=700, len(aliases)
          for g in ('kof2002','kof97','kof98','mslug3','neobombe'):
              assert g in games,g
          print("PASS eligible NeoGeo MAME125 FBNeo:",len(games),"sets",len(aliases),"aliases")
          PY
      - name: Verify authentic PS3 Arcade parent and clone map
        run: |
          test -s pkgfiles/USRDIR/ARCADE/arcade_parents.tsv
          test -s pkgfiles/USRDIR/ARCADE/fbneo_legacy_clones.tsv
          python3 - <<'PY'
          from pathlib import Path
          root=Path("pkgfiles/USRDIR/ARCADE")
          parent=(root/"arcade_parents.tsv").read_text().splitlines()
          clones=(root/"fbneo_legacy_clones.tsv").read_text().splitlines()
          assert "kf2k2mp\tkof2002" in parent
          assert "kf2k2mp\tkof2002\t3\t14" in clones
          new_aliases=(root/"fbneo_legacy_clone_aliases.tsv").read_text().splitlines()
          all_aliases=(root/"fbneo_legacy_all_aliases.tsv").read_text().splitlines()
          assert len([x for x in clones if x and not x.startswith("#")])>=33
          assert len([x for x in new_aliases if x and not x.startswith("#")])>=135
          assert len([x for x in all_aliases if x and not x.startswith("#")])>=850
          for code in ("kf2k2pla","kof98k","garoubl","ms5plus"):
              assert any(x.startswith(code+"\t") for x in clones),code
          print("PASS V15.74 33 exact CRC-compatible NeoGeo clone drivers; 135+ extra binary aliases")
          print("PASS user clone=3 files + kof2002 parent=11 files")
          PY
          python3 tools/build_arcade_clone_maps.py \
            --fbneo pkgfiles/USRDIR/ARCADE/fbneo_ps3_crc_manifest.tsv \
            --mame pkgfiles/USRDIR/ARCADE/mame0125_neogeo.tsv \
            --legacy-games pkgfiles/USRDIR/ARCADE/fbneo_legacy_games.tsv \
            --parents /tmp/arcade_parent_regenerated.tsv \
            --clones /tmp/arcade_clone_regenerated.tsv \
            --base-aliases pkgfiles/USRDIR/ARCADE/fbneo_legacy_aliases.tsv \
            --clone-aliases /tmp/arcade_clone_aliases_regenerated.tsv \
            --all-aliases /tmp/arcade_all_aliases_regenerated.tsv
          cmp /tmp/arcade_parent_regenerated.tsv pkgfiles/USRDIR/ARCADE/arcade_parents.tsv
          cmp /tmp/arcade_clone_regenerated.tsv pkgfiles/USRDIR/ARCADE/fbneo_legacy_clones.tsv
          cmp /tmp/arcade_clone_aliases_regenerated.tsv pkgfiles/USRDIR/ARCADE/fbneo_legacy_clone_aliases.tsv
          cmp /tmp/arcade_all_aliases_regenerated.tsv pkgfiles/USRDIR/ARCADE/fbneo_legacy_all_aliases.tsv
          echo "PASS verified independent FBNeo and MAME clone/parent mappings"
      - name: Verify KOF2002 old BIOS automatic FBNeo legacy selection and 16:9
        run: |
          test -s pkgfiles/USRDIR/ARCADE/mame0125_neogeo.tsv
          mkdir -p /tmp/arcade_native_route_test
          cp pkgfiles/USRDIR/ARCADE/mame0125_neogeo.tsv /tmp/arcade_native_route_test/mame0125_neogeo.tsv
          cp pkgfiles/USRDIR/ARCADE/fbneo_legacy_games.tsv /tmp/arcade_native_route_test/fbneo_legacy_games.tsv
          cp pkgfiles/USRDIR/ARCADE/arcade_parents.tsv /tmp/arcade_native_route_test/arcade_parents.tsv
          cp pkgfiles/USRDIR/ARCADE/fbneo_legacy_clones.tsv /tmp/arcade_native_route_test/fbneo_legacy_clones.tsv
          python3 tests/make_arcade_native_select_fixture.py
          gcc -std=gnu99 -O1 -g -Wall -Wextra -Werror=implicit-function-declaration \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            '-DARCADE_NATIVE_ROM_ROOT="/tmp/arcade_native_route_test/"' \
            '-DARCADE_NATIVE_BIOS_PATH="/tmp/arcade_native_route_test/neogeo.zip"' \
            '-DARCADE_MAME125_CATALOG_PATH="/tmp/arcade_native_route_test/mame0125_neogeo.tsv"' \
            '-DARCADE_LEGACY_GAMES_PATH="/tmp/arcade_native_route_test/fbneo_legacy_games.tsv"' \
            '-DARCADE_NATIVE_PARENT_MAP_PATH="/tmp/arcade_native_route_test/arcade_parents.tsv"' \
            '-DARCADE_NATIVE_LEGACY_CLONES_PATH="/tmp/arcade_native_route_test/fbneo_legacy_clones.tsv"' \
            -Isrc/core src/core/arcade_native_select.c tests/test_arcade_native_select.c \
            -o /tmp/test_arcade_native_select
          /tmp/test_arcade_native_select
          grep -q 'arcade_native_engine_select(rom_path' src/ps3/main.c
          grep -q 'arcade_diag_event("RUTA_ARCADE_BIOS_Y_ROMSET_CRC"' src/ps3/main.c
          grep -q 'video_aspect_ratio = "1.777800"' pkgfiles/USRDIR/retroarch.cfg
          test -s pkgfiles/USRDIR/cores/fb_neo_legacy.SELF
          echo "PASS: Auto FBNeo legacy multiple verified NeoGeo games + old BIOS; no modification to any game"
      - name: Verify exact user clone 3 ZIP chips + 11 parent + BIOS, no second TXT
        run: |
          cp pkgfiles/USRDIR/ARCADE/fbneo_ps3_crc_manifest.tsv /tmp/arcade_native_route_test/fbneo_ps3_crc_manifest.tsv
          gcc -std=gnu99 -O1 -g -Wall -Wextra -Werror=implicit-function-declaration \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            '-DSF_ARCADE_DIAG_PATH="/tmp/arcade_native_route_test/diagnostico_mame.txt"' \
            '-DSF_ARCADE_ROM_MANIFEST="/tmp/arcade_native_route_test/fbneo_ps3_crc_manifest.tsv"' \
            '-DSF_MAME125_CATALOG="/tmp/arcade_native_route_test/mame0125_neogeo.tsv"' \
            '-DSF_ARCADE_ROM_ROOT="/tmp/arcade_native_route_test"' \
            -Isrc/core src/core/arcade_diag.c tests/test_arcade_clone_diagnostic.c \
            -o /tmp/test_arcade_clone_diagnostic
          /tmp/test_arcade_clone_diagnostic
      - name: Verify focused MAME125 report and no extra TXT
        run: |
          printf 'kof2002\t\tneogeo\t@\t-\t-\n' > /tmp/arcade_native_route_test/fbneo_fixture.tsv
          gcc -std=gnu99 -O1 -g -Wall -Wextra -Werror=implicit-function-declaration \
            '-DSF_ARCADE_DIAG_PATH="/tmp/arcade_native_route_test/diagnostico_mame.txt"' \
            '-DSF_ARCADE_ROM_MANIFEST="/tmp/arcade_native_route_test/fbneo_fixture.tsv"' \
            '-DSF_MAME125_CATALOG="/tmp/arcade_native_route_test/mame0125_neogeo.tsv"' \
            '-DSF_ARCADE_ROM_ROOT="/tmp/arcade_native_route_test"' \
            -Isrc/core src/core/arcade_diag.c tests/test_arcade_mame_freeze_diag.c \
            -o /tmp/test_arcade_mame_freeze_diag
          /tmp/test_arcade_mame_freeze_diag
          grep -q 'sf_arcade_memory_snapshot' src/ps3/main.c
          grep -q 'FASE_POST_100_PORCIENTO=NO_OBSERVABLE' src/core/arcade_diag.c
          test "$(find /tmp/arcade_native_route_test -maxdepth 1 -name 'diagnostico_*.txt' | wc -l)" -eq 1
          echo "PASS: MAME-specific prelaunch CRC, BIOS, resources, memory probe; one report"
      - name: Ensure original PS1, PS2, PS3, SNES, BDISO sources are untouched
        run: |
          grep -q "PLAT_ARCADE = 5, PLAT_COUNT = 6" src/core/layout.h
          grep -q "TEX_TAB_ARCADE = 29, TEX_CASE_ARCADE = 30" src/core/render.h
          grep -q 'a->host.launch_arcade(path)' src/core/app.c
          grep -q 'host.launch_arcade = launch_arcade_native;' src/ps3/main.c
          test -s pkgfiles/USRDIR/cores/fb_neo.SELF
          test -s pkgfiles/USRDIR/cores/fb_neo_legacy.SELF
          test -s pkgfiles/USRDIR/MAME125/mame125.SELF
          test -s pkgfiles/USRDIR/ARCADE/arcade_engines.tsv
          test -s spookyflow.pkg
          python3 tests/verify_compiled_pkg.py spookyflow.pkg
          sha256sum spookyflow.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: SPOOKYFLOW-V15-74-ARCADE-CRC-CLONES-33
          path: |
            spookyflow.pkg
            build/pkg/USRDIR/EBOOT.BIN
          if-no-files-found: error
