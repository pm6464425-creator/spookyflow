name: V15.76 GPT capacity zero recovery diagnostics
on:
  push:
    branches: [fix/v15-76-gpt-zero-capacity-ps3]
  workflow_dispatch:
jobs:
  gpt-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run 35 GPT and LV2 zero capacity regressions
        run: |
          mkdir -p build-host
          cc -std=c99 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Isrc/ps3 \
            src/ps3/spooky_gpt.c tests/test_v15_75_gpt.c \
            -o build-host/test_v15_75_gpt
          ./build-host/test_v15_75_gpt
      - name: Verify legacy BDISO and FAT32 path untouched
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/ps3/sf_bdiso_ntfs.c').read_text()
          assert 'n=ntfsMountDevice(s_devices[u],&s_mount[u],NTFS_DEFAULT | NTFS_RECOVER);' in s
          assert 'n=sf_gpt_try_mount(u,s_devices[u],&s_mount[u]);' in s
          assert s.index('n=ntfsMountDevice(') < s.index('n=sf_gpt_try_mount(')
          assert 'ps3ntfs_file_to_sectors(native,sectors,counts,SF_BD_RAWISO_MAX,1);' in s
          assert 'cobra_load_vsh_plugin(' in s
          assert 'NTFS_DEFAULT|NTFS_READ_ONLY' in Path('src/ps3/sf_gpt_ps3.c').read_text()
          assert 'sf_gpt_diag_begin()' in Path('src/ps3/main.c').read_text()
          assert 'diagnostico_gpt.txt' in Path('src/ps3/ps3_fs.c').read_text()
          assert 'raw_iso.sprx' in Path('ci/build_ps3.sh').read_text()
          print('PASS: 9 invariants')
          PY
  ps3-pkg-gpt:
    needs: gpt-unit
    runs-on: ubuntu-22.04
    env:
      TOOLCHAIN_URL: https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Set up PS3 environment
        run: |
          echo "PS3DEV=${GITHUB_WORKSPACE}/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=${GITHUB_WORKSPACE}/ps3dev" >> "$GITHUB_ENV"
      - name: Set up Python 2 package tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python2.7 || true
          sudo apt-get install -y -qq python2 || true
      - name: Reuse cached PS3 SDK
        id: cache-ps3dev
        uses: actions/cache@v4
        with:
          path: ps3dev
          key: ps3dev-${{ env.TOOLCHAIN_URL }}-v1
      - name: Download PS3 SDK as needed
        if: steps.cache-ps3dev.outputs.cache-hit != 'true'
        run: |
          curl -sL "$TOOLCHAIN_URL" | tar xz -C ./
          curl -sL https://github.com/ps3dev/PSL1GHT/raw/master/ppu/include/sysutil/sysutil.h \
            -o ps3dev/ppu/include/sysutil/sysutil.h
      - name: Install required NVIDIA Cg shader compiler for existing PS1 engine
        run: |
          sudo add-apt-repository -y multiverse
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nvidia-cg-toolkit
          command -v cgc
          test -x "$PS3DEV/bin/cgcomp"
      - name: Build PS3 PKG
        run: bash ci/build_ps3.sh
      - name: Verify actual package
        run: python3 tests/verify_compiled_pkg.py spookyflow.pkg
      - name: Publish experimental build artifact (not a stable release)
        uses: actions/upload-artifact@v4
        with:
          name: SPOOKYFLOW_V15_76_GPT_CAPACIDAD_ZERO_EXPERIMENTAL
          path: spookyflow.pkg
          if-no-files-found: error
