# Build spookyflow for PS3 on every push (and on demand from the Actions tab).
#
# 1. host-tests: compiles the portable core with gcc and runs the unit tests,
#    then renders the preview PNGs (uploaded as an artifact).
# 2. ps3-pkg: PRIMARY route. Downloads the prebuilt PS3 toolchain tarball that
#    bucanero/apollo-ps3's own CI uses (PSL1GHT + portlibs incl. Tiny3D,
#    since Apollo links -ltiny3d without building it), then `make pkg`.
# 3. ps3-pkg-docker: FALLBACK route, allowed to fail. Same build inside the
#    flipacholas/ps3devextra image (PSL1GHT + Tiny3D, Alpine, ~2018).
#
# Honest notes (nothing here could be run before publishing):
#  - The toolchain URL is copied from apollo-ps3's workflow; if that release
#    disappears the primary job fails and the fallback artifact is the one to use.
#  - Whether the tarball's libtiny3d.a matches wargio/tiny3D master is unverified;
#    ci/build_ps3.sh builds Tiny3D from source if it is missing.
#  - Package tools (sfo.py / pkg.py) need Python 2; we install it like Apollo does.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SensaCine theatrical poster markup is publicly available (nonblocking)
        continue-on-error: true
        run: python3 tests/probe_sensacine.py
      - name: Unit tests (portable core, ASan + UBSan)
        run: make -f Makefile.host test
      - name: V15.12 Spanish Latin America - ten independent visual and compatibility reviews
        run: python3 tests/test_es419_ui.py
      - name: Ensure fourth BDISO cover tab cannot be excluded again
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path("src/core/cover_cache.h").read_text()
          c=Path("src/core/cover_cache.c").read_text()
          t=Path("tests/test_core.c").read_text()
          assert '#define CC_TABS             PLAT_COUNT' in h
          assert 'if (count <= 0 || tab < 0 || tab >= CC_TABS) return;' in c
          assert 'test_bdiso_cache_fourth_tab();' in t
          print("PASS: BDISO index 3 included in cover cache and regression test")
          PY
      - name: PS2 V15.13 - 28 integration and 22 portable safety checks
        run: |
          python3 tests/test_ps2_integration.py
          mkdir -p build-host
          cc -std=c99 -O2 -Wall -Wextra -Werror -fsanitize=undefined -Isrc/core src/core/ps2_mount_plan.c tests/test_ps2_mount_plan.c -o build-host/test_ps2_mount_plan
          ./build-host/test_ps2_mount_plan
      - name: PS2 HEN Classics conversion - 35 independent safety and integration checks
        run: python3 tests/test_ps2_hen_integration.py
      - name: Cobra launch integration static checks
        run: python3 tests/test_cobra_integration.py
      - name: Real 3D release website and JPEG smoke checks
        continue-on-error: true
        run: python3 tests/test_bdiso_edition_live.py
      - name: True PS3 BDISO end-to-end diagnostic regressions
        run: |
          python3 tests/test_bdiso_trace.py
          mkdir -p build-host
          cc -std=c99 -O2 -Wall -Wextra -Werror -Isrc/core src/core/cover_diag.c tests/test_cover_diag.c -o build-host/test_cover_diag
          ./build-host/test_cover_diag
      - name: Real Blu-ray 3D Spanish and English edition matching C tests
        run: |
          mkdir -p build-host
          cc -std=c99 -O2 -Wall -Wextra -Werror -fsanitize=undefined -Isrc/core src/core/movie_edition.c tests/test_movie_edition.c -o build-host/test_movie_edition
          ./build-host/test_movie_edition
      # Includes the V13 regular-poster migration, Spanish-first policy,
      # manually supplied cover priority and the watermark-only visual gate.
      - name: V15.11 live Ace Combat 3 Libretro and Tekken Golden Leon LaunchBox PNG probes
        continue-on-error: true
        run: python3 tests/probe_ps1_extra_covers_live.py
      - name: V15.10 PS1 real title catalog and localized Spanish game matching
        run: |
          python3 tests/test_ps1_catalog_builder.py
          mkdir -p build-host
          cc -std=c99 -O2 -Wall -Wextra -Werror -Isrc/core src/core/ps1_name_match.c src/core/util.c tests/test_ps1_name_match.c -o build-host/test_ps1_name_match
          ./build-host/test_ps1_name_match
      - name: V15.9 PS1 true CUE/BIN tracks, Libretro exact-title source and HDD JPEG recovery
        run: python3 tests/test_ps1_cue_bin_recovery.py
      - name: V15.8 PS1 covers serial and verified source regressions
        run: python3 tests/test_ps1_cover_fix.py
      - name: V15.7 FlowMovie native NTFS retry and real hardware log regression
        run: python3 tests/test_flowmovie_native_retry.py
      - name: V15.6 native NTFS detach and reconnection recovery regressions
        run: python3 tests/test_bdiso_reconnect.py
      - name: Real PS3 V15.4 NTFS root discovery regression and hotplug integration
        run: python3 tests/test_native_bdiso_root.py
      - name: PS3 forensic USB/NTFS diagnostic report invariants
        run: python3 tests/test_usb_diagnostics.py
      - name: V15.3 restore valid BDISO NTFS index entries (unreadable legacy headers)
        run: python3 tests/test_bdiso_restore.py
      - name: BDISO physical USB auto-sync and stale NTFS-pointer regressions
        run: python3 tests/test_bdiso_hotplug.py
      - name: Under the Sea 2009 IMDb identity and no-key poster regressions
        run: python3 tests/test_bdiso_undersea.py
      - name: Probe public poster for Under the Sea 2009 (nonblocking)
        continue-on-error: true
        run: python3 tests/probe_undersea_live.py
      - name: BDISO cinema 2:3 geometry and strict movie-identity regressions
        run: python3 tests/test_bdiso_v15.py
      - name: SensaCine theatrical poster HTML parsing tests (real examples)
        run: |
          mkdir -p build-host
          cc -std=c99 -O2 -Wall -Wextra -Werror -fsanitize=undefined -Isrc/core src/core/movie_sensacine.c tests/test_movie_sensacine.c -o build-host/test_movie_sensacine
          ./build-host/test_movie_sensacine
      - name: Check official Rio 2011 poster against live SensaCine HTML
        run: |
          mkdir -p build-host
          python3 - <<'PY'
          import urllib.request
          url="https://www.sensacine.com/peliculas/pelicula-146550/"
          req=urllib.request.Request(url,headers={
            "User-Agent":"Mozilla/5.0 (PLAYSTATION 3; SpookyFlow/1.0)",
            "Accept":"text/html,*/*", "Accept-Language":"es-ES,es;q=0.9",
            "Accept-Encoding":"identity"})
          with urllib.request.urlopen(req,timeout=20) as response:
            data=response.read(1024*1024)
          with open("build-host/sensacine_rio_2011.html","wb") as out:
            out.write(data)
          print("Official Rio 2011 movie page received:",len(data),"bytes")
          PY
          cc -std=c99 -O2 -Wall -Wextra -Werror -Isrc/core src/core/movie_sensacine.c tests/test_movie_sensacine_live.c -o build-host/test_movie_sensacine_live
          ./build-host/test_movie_sensacine_live build-host/sensacine_rio_2011.html
      - name: BDISO manual cover paths and clean-case priority checks
        run: python3 tests/test_bdiso_priority.py
      - name: BDISO integration checks (fourteen independent reviews)
        run: python3 tests/test_bdiso_integration.py
      - name: Direct BDISO NTFS regression checks (29)
        run: python3 tests/test_bdiso_ntfs_fix.py
      - name: PS3-style BDISO case visual regression checks (18)
        run: python3 tests/test_bdiso_ps3_case.py
      - name: Blu-ray 3D artwork source checks (33)
        run: python3 tests/test_bdiso_3d_sources.py
      - name: BDISO poster network diagnostics and retry checks (20)
        run: python3 tests/test_bdiso_cover_diagnostics.py
      - name: Public no-key BDISO cover regression checks (22)
        run: python3 tests/test_bdiso_keyless_covers.py
      - name: BDISO actual movie download button and HTTP checks (20)
        run: python3 tests/test_bdiso_real_download.py
      - name: Compiled movie metadata parser tests (nested real-world JSON)
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror -fsanitize=undefined -Isrc/core src/core/movie_catalog.c tests/test_movie_catalog.c -o build-host/test_movie_catalog
          ./build-host/test_movie_catalog
      - name: Spanish movie titles and 3D file recognition (all 26 real filenames)
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror -fsanitize=undefined -Isrc/core src/core/movie_spanish.c tests/test_movie_spanish.c -o build-host/test_movie_spanish
          ./build-host/test_movie_spanish
      - name: Public movie catalog live network smoke test (not PS3 hardware)
        continue-on-error: true
        run: python3 tests/test_bdiso_live_source.py
      - name: 30 identity and cover regression checks
        run: python3 tests/test_custom_identity.py
      - name: Render preview PNGs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          make -f Makefile.host preview
      - name: Decode real-format progressive JPEG without external image services
        run: |
          python3 - <<'PY'
          from PIL import Image
          im=Image.new("RGB",(250,372),(45,80,110))
          im.save("build-host/progressive.jpg",progressive=True,quality=88)
          PY
          cc -std=c99 -O2 -Wall -Wextra -Werror -Wno-unused-function -fsanitize=undefined -Isrc/ps3 -Ithird_party/include src/ps3/ps3_jpeg_soft.c tests/test_ps3_jpeg_soft.c -o build-host/test_ps3_jpeg_soft
          ./build-host/test_ps3_jpeg_soft build-host/progressive.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: preview/*.png

  ps3-pkg:
    needs: host-tests
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TOOLCHAIN_URL: https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: |
          echo "PS3DEV=${GITHUB_WORKSPACE}/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=${GITHUB_WORKSPACE}/ps3dev" >> "$GITHUB_ENV"
          echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> "$GITHUB_ENV"

      - name: Install Python 2 (needed by the PSL1GHT packaging scripts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python2.7 || true
          sudo apt-get install -y -qq python2 || true

      - name: Cache PS3 toolchain
        id: cache-ps3dev
        uses: actions/cache@v4
        with:
          path: ps3dev
          key: ps3dev-${{ env.TOOLCHAIN_URL }}-v1

      - name: Download PS3 toolchain
        if: steps.cache-ps3dev.outputs.cache-hit != 'true'
        run: |
          curl -sL "$TOOLCHAIN_URL" | tar xz -C ./
          # same refresh Apollo's CI does: newer sysutil.h from PSL1GHT master
          curl -sL https://github.com/ps3dev/PSL1GHT/raw/master/ppu/include/sysutil/sysutil.h -o ps3dev/ppu/include/sysutil/sysutil.h

      - name: Build PKG
        run: bash ci/build_ps3.sh

      - name: Verify compiled PKG title, transparent icon, Title ID, and package payload
        run: python3 tests/verify_compiled_pkg.py spookyflow.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: spookyflow-pkg-${{ env.sha_name }}
          path: |
            spookyflow.pkg
            spookyflow.gnpdrm.pkg
          if-no-files-found: error

      - name: Publish independent PS2 Cobra CFW build for controlled testing
        if: github.ref == 'refs/heads/experimental/v15-13-ps2-cobra'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases are immutable per commit: do not let an older CI run
          # replace the artifact belonging to a newer PS2 code revision.
          latest=$(git ls-remote origin refs/heads/experimental/v15-13-ps2-cobra | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded PS2 commit $GITHUB_SHA; branch now $latest"
            exit 0
          fi
          short="${GITHUB_SHA:0:8}"
          cp spookyflow.pkg SPOOKYFLOW_V15_13_PS2_COBRA_CFW_EXPERIMENTAL.pkg
          gh release create "spookyflow-v15-13-ps2-cobra-${short}" SPOOKYFLOW_V15_13_PS2_COBRA_CFW_EXPERIMENTAL.pkg \
            --target "$GITHUB_SHA" --prerelease \
            --title "SpookyFlow V15.13 — PS2 Cobra directo (prueba CFW)" \
            --notes "EXPERIMENTAL: PS2 ISO en HDD interno mediante Cobra sin webMAN MOD. No validado en PS3 física. HEN no admite esta ruta de ISO PS2 sin cifrar y la aplicación la bloquea para evitar daños. Requiere CFW con Cobra. PS1, PS3, BDISO y diseño V15.12 preservados. Ver PS2_V15_13_EXPERIMENTAL_ES.md."
      - name: Publish PS2 HEN Classics prerelease - latest commit only
        if: github.ref == 'refs/heads/experimental/v15-14-ps2-hen-classics'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/branches/experimental%2Fv15-14-ps2-hen-classics" --jq '.commit.sha')
          if [ "$CURRENT" != "$GITHUB_SHA" ]; then
            echo "Superseded build. No prerelease will be uploaded."
            exit 0
          fi
          short="${GITHUB_SHA:0:8}"
          cp spookyflow.pkg SPOOKYFLOW_V15_14_PS2_CLASSICS_HEN_EXPERIMENTAL.pkg
          gh release create "spookyflow-v15-14-ps2-hen-${short}" \
            SPOOKYFLOW_V15_14_PS2_CLASSICS_HEN_EXPERIMENTAL.pkg \
            --target "$GITHUB_SHA" --prerelease \
            --title "SpookyFlow V15.14 — PS2 Classics HEN (experimental)" \
            --notes "EXPERIMENTAL: cifrado PS2 ISO a ISO.BIN.ENC desde la PS3 para PS3HEN y preparación del PS2 Classics Placeholder; no se modifica la ISO original. Necesita PS2 Classics Placeholder instalado y activado. El usuario inicia PS2 Classics desde XMB. No monta directamente disco PS2 ISO en HEN. Compatible con ISO un archivo en /dev_hdd0/PS2ISO; divididos/USB no soportados en esta revisión. Preserva CFW PS2 Cobra, PS1, PS3 y BDISO. Pruebas automatizadas superadas; falta verificación en PS3 física. Ver PS2_V15_14_HEN_ES.md."
      # GitHub release assets can be downloaded directly (without Actions
      # artifact ZIP/login) unlike some sandbox links in the chat client.
      - name: Publish direct-download PS3 PKG release
        if: github.ref == 'refs/heads/fix/bdiso-cinema-2by3-strict-recognition'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spookyflow.pkg MI_PKG_V15_CINE_2X3_RIO_FIX.pkg
          gh release create mi-pkg-v15-cine-2x3-rio-fix MI_PKG_V15_CINE_2X3_RIO_FIX.pkg --target "$GITHUB_SHA" \
            --title "MI PKG V15 - Portadas 2x3 y reconocimiento correcto" \
            --notes "V15: corrige SOLO BDISO para carteles de cine 2:3: estrecha el estuche, aplica recorte proporcional centrado sin estirar ni crear franjas negras. Reconocimiento por nombre exacto + ano y ficha oficial Rio (2011) ID SensaCine 146550; descarta Extraño rio 2025 y Rio 2 2014. Mejora verificacion TMDB y Cinemeta. Nuevas caratulas en BDISO/COVERS/POSTERS con nombre del ISO, sin sobrescribir JPG antiguos. Mantiene estuche con marcas pequenas Blu-ray y 3D, compatibilidad NTFS, 4a pestana y juegos PS1/PS2/PS3 sin modificar. PKG y tests verificados; comprobacion real en PS3 pendiente."

      - name: Publish direct-download V15.1 Under the Sea movie poster fix
        if: github.ref == 'refs/heads/fix/bdiso-under-the-sea-2009'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spookyflow.pkg SPOOKYFLOW_V15_1_BAJO_EL_MAR_FIX.pkg
          gh release create spookyflow-v15-1-bajo-el-mar-fix SPOOKYFLOW_V15_1_BAJO_EL_MAR_FIX.pkg --target "$GITHUB_SHA" \
            --title "SpookyFlow V15.1 - Bajo el mar 3D (2009)" \
            --notes "V15.1: agrega fuente sin API key mediante IMDb verificado tt1020876 para Under the Sea 3D (2009), también reconocido como Bajo el mar. Preserva carátulas manuales, posters 2:3, juegos y funcionamiento V15 sin cambios. Pruebas automatizadas aprobadas; verificación real en PS3 pendiente."

      - name: Publish direct-download V15.2 USB hotplug PKG
        if: github.ref == 'refs/heads/fix/bdiso-usb-hotplug-auto-sync'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spookyflow.pkg SPOOKYFLOW_V15_2_USB_AUTO_DETECT.pkg
          gh release create spookyflow-v15-2-usb-auto-detect SPOOKYFLOW_V15_2_USB_AUTO_DETECT.pkg --target "$GITHUB_SHA" \
            --title "SpookyFlow V15.2 - Detectar peliculas al conectar/desconectar USB" \
            --notes "V15.2: detecta conexion/desconexion USB en tiempo real con debounce; rescan automatico de BDISO sin prepNTFS bloqueante; elimina referencias BDISO de webMAN para discos retirados; vuelve a detectar peliculas al reconectar. Mantiene V15.1 (Bajo el mar), carteles 2:3 y PS1/PS2/PS3. Compilacion y pruebas host verificadas; comprobacion en PS3 pendiente."

      - name: Publish direct-download V15.3 restored BDISO detection
        if: github.ref == 'refs/heads/fix/bdiso-hotplug-restore-native-detection'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spookyflow.pkg SPOOKYFLOW_V15_3_RECONOCE_DISCO_NTFS.pkg
          gh release create spookyflow-v15-3-disco-ntfs-fix SPOOKYFLOW_V15_3_RECONOCE_DISCO_NTFS.pkg --target "$GITHUB_SHA" \
            --title "SpookyFlow V15.3 - Corrige deteccion de peliculas NTFS" \
            --notes "V15.3 corrige regresion V15.2 que ocultaba peliculas con referencias .ntfs[BDISO] antiguas, ilegibles o de cabeceras alternativas. Mantiene deteccion automatica de conexion y desconexion USB, filtrado de peliculas cuando no hay disco, correccion de Bajo el mar 3D 2009 y estuche 2:3. Tests de host y estructura PKG verificados, pendiente prueba real en PS3."

      - name: Publish direct-download V15.4 PS3 USB diagnostic PKG
        if: github.ref == 'refs/heads/diag/bdiso-ntfs-real-ps3-report'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spookyflow.pkg SPOOKYFLOW_V15_4_DIAGNOSTICO_USB_NTFS.pkg
          gh release create spookyflow-v15-4-diagnostico-usb-ntfs SPOOKYFLOW_V15_4_DIAGNOSTICO_USB_NTFS.pkg --target "$GITHUB_SHA" \
            --title "SpookyFlow V15.4 - Diagnostico real USB/NTFS/BDISO" \
            --notes "Compilacion de diagnostico de solo lectura. Guarda /dev_hdd0/tmp/spookyflow/diagnostico_usb_ntfs.txt con los resultados reales de los puertos USB, montajes NTFS, carpetas BDISO, webMAN y escaneo de la biblioteca. No altera archivos externos ni cambia algoritmos de reconocimiento V15.3. Pruebas host y PKG completadas; se necesita el TXT de la PS3 para identificar el problema concreto."

      - name: Publish direct V15.5 native USB BDISO detection fix
        if: github.ref == 'refs/heads/fix/bdiso-native-root-discovery-v15-5'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spookyflow.pkg SPOOKYFLOW_V15_5_RECONOCIMIENTO_NTFS_REAL.pkg
          gh release create spookyflow-v15-5-native-bdiso-root-fix SPOOKYFLOW_V15_5_RECONOCIMIENTO_NTFS_REAL.pkg --target "$GITHUB_SHA" \
            --title "SpookyFlow V15.5 - Detecta BDISO NTFS visible solo en libntfs" \
            --notes "Corrige el problema identificado por diagnostico_usb_ntfs.txt de PS3: NTFS USB000 montado, cuatro ISO en BDISO leidos por libntfs, pero SCANNER_USB_MOVIE_ROOTS=0. Al preparar la biblioteca, detecta particiones BDISO NTFS realmente montadas e incorpora su raiz aunque /dev_usb000 no exista en lv2. Mantiene retirada/reconexion USB, correccion Bajo el mar (2009), carteles 2:3 y las otras plataformas. Incluye diagnostico en /dev_hdd0/tmp/spookyflow/diagnostico_usb_ntfs.txt. Pruebas simuladas del fallo y compilacion verificadas; confirmar comportamiento final en PS3."

      - name: Publish direct V15.6 native NTFS reconnect recovery PKG
        if: github.ref == 'refs/heads/fix/bdiso-ntfs-reconnect-v15-6'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spookyflow.pkg SPOOKYFLOW_V15_6_RECONECTA_USB_NTFS.pkg
          gh release create spookyflow-v15-6-ntfs-reconnect-fix SPOOKYFLOW_V15_6_RECONECTA_USB_NTFS.pkg --target "$GITHUB_SHA" \
            --title "SpookyFlow V15.6 - Reconexion automatica USB NTFS" \
            --notes "V15.6: recupera el montaje nativo libntfs al retirar y volver a conectar el disco. Registra la desconexion fisica, invalida montajes NTFS obsoletos y remonta la particion BDISO si su acceso falla. Incluye diagnostico_usb_ntfs.txt en /dev_hdd0/tmp/spookyflow, mantiene portadas 2:3 y correcciones V15.5. Pruebas de host y PKG completadas; la confirmacion con USB real en PS3 sigue pendiente."

      - name: Publish direct-download V15.7 FlowMovie USB NTFS auto-reconnect fix
        if: github.ref == 'refs/heads/fix/flowmovie-ntfs-retry-v15-7'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spookyflow.pkg SPOOKYFLOW_V15_7_FLOWMOVIE_NTFS_RECONNECT.pkg
          gh release create spookyflow-v15-7-flowmovie-ntfs-retry SPOOKYFLOW_V15_7_FLOWMOVIE_NTFS_RECONNECT.pkg --target "$GITHUB_SHA" \
            --title "SpookyFlow V15.7 - Reconexion NTFS basada en FlowMovie 3D" \
            --notes "Implementacion comparada con fuente original FlowMovie 3D source/main.cpp (refresh_usb_state). Corrige falla real PS3: tras conectar USB, ntfsMountDevice fallo 6 veces y solo despues monto la particion, cuando scan roots ya se habia fijado a cero. V15.7 reintenta en intervalos antes de construir rutas BDISO y continua recuperacion mientras disco siga conectado. Los lectores de carpetas ya no montan NTFS de forma oculta. Mantiene PS1/PS2/PS3, caratulas y diagnostico en /dev_hdd0/tmp/spookyflow/diagnostico_usb_ntfs.txt. Pruebas y compilacion automatizada verificables; pendiente prueba USB fisica."

      - name: Publish direct-download V15.8 PS1 cover recovery PKG
        if: github.ref == 'refs/heads/fix/ps1-cover-id-sources-v15-8'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spookyflow.pkg SPOOKYFLOW_V15_8_CARATULAS_PS1_FIX.pkg
          gh release create spookyflow-v15-8-caratulas-ps1 SPOOKYFLOW_V15_8_CARATULAS_PS1_FIX.pkg --target "$GITHUB_SHA" \
            --title "SpookyFlow V15.8 - Caratulas PS1 mejoradas" \
            --notes "Correccion exclusiva PS1: deteccion de seriales SLUS SCUS SLES y otros en nombres CHD PBP BIN y CUE cuando no se lee el ID interno; seleccion del data TRACK en CUE multifichero; fuente verificada xlenore prioritaria y reintentos frente a marcadores 404 antiguos; log por titulo sin serial, no disponible online o error de red. BDISO V15.7, PS2 y PS3 sin cambios funcionales. Pruebas automatizadas y PKG verificados; validar portadas en PS3 real."

      - name: Publish direct V15.9 real PS1 CUE BIN covers fix
        if: github.ref == 'refs/heads/fix/ps1-cue-bin-association-v15-9'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spookyflow.pkg SPOOKYFLOW_V15_9_CARATULAS_PS1_CUE_BIN.pkg
          gh release create spookyflow-v15-9-ps1-cue-bin-covers SPOOKYFLOW_V15_9_CARATULAS_PS1_CUE_BIN.pkg --target "$GITHUB_SHA" \
            --title "SpookyFlow V15.9 - Caratulas PS1 CUE y BIN" \
            --notes "PS1: CUE/BIN multi-track con FILE y nombres no coincidentes se agrupan como un solo juego; se detecta serial del CUE si existe; si no hay serial/404, busca nombre exacto con region en la biblioteca real de Libretro/RetroArch. Recupera JPEG progresivo descargado en HDD si el decodificador hardware lo rechaza. Invalida solo antiguos marcadores/caches negativos de PS1. Incluye por juego en log.txt: GAME serial, EXISTING_COVER, SEARCH, SOURCE status, NETWORK_ERROR, NO_ART_ON_SOURCES. PS2, PS3 y BDISO 3D conservan V15.8/V15.7. Pruebas y PKG verificadas; comprobar los juegos reales en PS3."

      - name: Publish PS1 normalized names real catalog V15.10 PKG
        if: github.ref == 'refs/heads/fix/ps1-catalog-title-matching-v15-10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spookyflow.pkg SPOOKYFLOW_V15_10_PS1_NOMBRES_CARATULAS.pkg
          gh release create spookyflow-v15-10-ps1-nombres-caratulas SPOOKYFLOW_V15_10_PS1_NOMBRES_CARATULAS.pkg --target "$GITHUB_SHA" \
            --title "SpookyFlow V15.10 - PS1 identifica caratulas por nombres de juegos" \
            --notes "PS1: el PKG contiene un indice verificado de mas de 7.000 nombres reales de portadas Libretro PlayStation; normaliza nombres de CUE como 'Disney Tarzan Latino.cue' y los asocia con 'Disney Tarzan (Spain).png', descargando la portada con su nombre original. Prioriza la region apropiada, tolera etiquetas latino/espanol/track/disc sin emparejamientos imprecisos. Conserva descarga por serial, caratulas manuales, soporte CUE/BIN, PS2/PS3 y BDISO intacto, y registra MATCH/SOURCE/ERROR. El indice se genera durante el build desde la fuente publica; si no se puede obtener, la compilacion falla en lugar de publicar un paquete roto. Pruebas de host y PKG verificadas; prueba de PS3 real pendiente."

      - name: Publish direct V15.11 Ace Combat 3 and Tekken Golden Leon PS1 cover fix
        if: github.ref == 'refs/heads/fix/ps1-ace-combat3-golden-leon-v15-11'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp spookyflow.pkg SPOOKYFLOW_V15_11_PS1_ACE_COMBAT3_GOLDEN_LEON.pkg
          gh release create spookyflow-v15-11-ps1-ace-golden-leon SPOOKYFLOW_V15_11_PS1_ACE_COMBAT3_GOLDEN_LEON.pkg --target "$GITHUB_SHA" \
            --title "SpookyFlow V15.11 - Ace Combat 3 y Tekken Golden Leon" \
            --notes "Correccion PS1 exclusiva: Ace Combat 3 reconoce su titulo oficial Ace Combat 3 - Electrosphere en la coleccion Libretro (USA y Europa multilenguaje). Tekken 3 OT Golden Leon es una modificacion rusa con portada propia verificada en LaunchBox; no utiliza la portada ni el ID visual de Tekken 3 original. La imagen descargada se guarda con el nombre del CUE. Mantiene los 9301 nombres reales del catalogo PS1 y conserva las caratulas existentes; BDISO, PS2, PS3 y el montaje NTFS permanecen intactos. Pruebas automatizadas y paquete PS3 verificados; falta probar las dos imagenes en la PS3 real."

      - name: Publish final SpookyFlow V15.12 es-419 PKG preserving V15.11
        if: github.ref == 'refs/heads/feat/es-419-ui-only-v15-12'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="spookyflow-v15-12-espanol-latinoamericano"
          PKG="SPOOKYFLOW_V15_12_ESPANOL_LATINOAMERICANO.pkg"
          cp spookyflow.pkg "$PKG"
          echo "Confirming that this build is still the newest source revision"
          HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/feat%2Fes-419-ui-only-v15-12" --jq '.commit.sha')"
          if [ "$GITHUB_SHA" != "$HEAD_SHA" ]; then
            echo "Old workflow revision ($GITHUB_SHA vs $HEAD_SHA); not publishing stale PKG"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release: replace stale asset with current verified PKG"
            gh release upload "$TAG" "$PKG" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
          else
            gh release create "$TAG" "$PKG" --target "$GITHUB_SHA" \
              --title "SpookyFlow V15.12 - Interfaz en español latinoamericano" \
              --notes "Edicion exclusiva de los textos de SpookyFlow V15.11: menus, opciones, ayuda, avisos, mensajes de carga y tarjetas en espanol latinoamericano. MISMAS tipografias DejaVu originales, tamanos, colores, posiciones, controles, iconos, fondos, animaciones, PS1 CUE BIN, caratulas, PS2, PS3 y BDISO. Los ajustes guardados siguen compatibles, el nombre en XMB se mantiene MIS JUEGOS PS3 PS2 PS1. Diez auditorias de inmutabilidad comparan los blobs exactos de los modulos protegidos con la V15.11; tests del nucleo y paquete real de PS3 verificados. No se ha efectuado validacion visual en una consola fisica."
          fi

  ps3-pkg-docker:
    needs: host-tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build PKG in flipacholas/ps3devextra
        run: |
          docker run --rm -v "$PWD:/src" -w /src flipacholas/ps3devextra:latest \
            sh -c 'command -v bash >/dev/null || apk add --no-cache bash git; bash ci/build_ps3.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: spookyflow-pkg-docker-fallback
          path: "*.pkg"
          if-no-files-found: warn
