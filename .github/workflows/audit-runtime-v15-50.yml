name: Audit source-built pSNES 7.2 real video telemetry
on:
  push:
    branches: [fix/v15-50-psnes-runtime-graphics-probe]
    paths: [tools/build_psnes_runtime_instrumented.sh, tools/psnes_inject_runtime_video_probe.py, .github/workflows/audit-runtime-v15-50.yml]
  workflow_dispatch:
jobs:
  native-psnes-telemetry-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TOOLCHAIN_URL: https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: tc
        with:
          path: ps3dev
          key: ps3dev-https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz-v1
      - name: Fetch cached PS3 toolchain when necessary
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 "$TOOLCHAIN_URL" | tar xz -C ./
      - name: Build ACTUAL pSNES 7.2 source with in-engine telemetry
        run: |
          set -euo pipefail
          export PS3DEV="$PWD/ps3dev"
          export PSL1GHT="$PS3DEV"
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PATH"
          bash tools/build_psnes_runtime_instrumented.sh /tmp/sf-v15-50-engine /tmp/sf-v15-50-pemu-source
      - name: Sign native experimental APP SELF and verify executable
        run: |
          set -euo pipefail
          export PATH="$PWD/ps3dev/bin:$PWD/ps3dev/ppu/bin:$PATH"
          elf=/tmp/sf-v15-50-engine/PSNES_RUNTIME_GRAPHICS.elf
          make_self "$elf" /tmp/sf-v15-50-engine/PSNES_RUNTIME_GRAPHICS.SELF
          python3 - <<'PY'
          import pathlib,struct
          elf=pathlib.Path("/tmp/sf-v15-50-engine/PSNES_RUNTIME_GRAPHICS.elf").read_bytes()
          app=pathlib.Path("/tmp/sf-v15-50-engine/PSNES_RUNTIME_GRAPHICS.SELF").read_bytes()
          assert elf[:6]==b"\x7fELF\x02\x02"
          assert app[:4]==b"SCE\x00"
          off=struct.unpack_from(">Q",app,0x28)[0]
          assert struct.unpack_from(">I",app,off+12)[0]==4
          print("PASS source-built pSNES with native in-process telemetry and signed APP SELF",len(app))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v15-50-source-psnes-runtime-telemetry
          path: |
            /tmp/sf-v15-50-engine/PSNES_RUNTIME_GRAPHICS.elf.sha256
            /tmp/sf-v15-50-engine/PSNES_RUNTIME_GRAPHICS.SELF
          retention-days: 7
